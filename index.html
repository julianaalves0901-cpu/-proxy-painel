<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Proxy System — Painel</title>
<style>
:root{
  --bg:#020914;
  --card:#07111f;
  --card2:#050d18;
  --line:#102a4a;
  --blue:#3479f2;
  --cyan:#52e4f2;
  --text:#f0f6ff;
  --muted:#71829c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
radial-gradient(circle at 50% 0%,#10285d 0,#06152e 28%,#020914 65%);color:var(--text)}
body{padding:0 0 34px}
button,input{font:inherit}
.top{
  position:sticky;top:0;z-index:5;
  padding:18px 14px 10px;
  background:rgba(2,9,20,.86);backdrop-filter:blur(16px);
}
.tabs{
  display:flex;gap:7px;padding:3px;
  border:1px solid #153052;border-radius:28px;background:#071323;
}
.tab{flex:1;border:0;background:transparent;color:#72829c;padding:14px 10px;border-radius:20px;font-weight:800;font-size:17px}
.tab.active{color:white;background:linear-gradient(135deg,#3579ed,#2e6ee0);box-shadow:0 7px 18px #1553bf55}
.lang{
  position:absolute;right:14px;top:66px;
  display:flex;gap:4px;padding:5px;
  border:1px solid #243653;border-radius:28px;background:#111c2c;
}
.lang button{border:0;background:transparent;color:#8794aa;border-radius:22px;padding:10px 15px;font-weight:800}
.lang button.active{background:#28a8e9;color:white;box-shadow:0 0 18px #27b8ee66}
main{max-width:820px;margin:34px auto;padding:0 14px}
.card{
  background:linear-gradient(145deg,rgba(8,18,32,.96),rgba(3,11,20,.98));
  border:1px solid var(--line);border-radius:34px;padding:28px 34px;margin:0 0 28px;
  box-shadow:0 20px 50px #0004;
}
.title{color:#8eeaf3;font-size:25px;font-weight:850;letter-spacing:2px;margin-bottom:28px}
.license{font-size:22px;letter-spacing:1px;padding-bottom:28px;border-bottom:1px solid #17253a}
.row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:28px}
.label{color:#70819a;font-weight:800;letter-spacing:1px}
.time{color:#91eff4;font-size:28px;font-weight:850}
.ipbox{background:#040c17;border:1px solid #112746;border-radius:27px;padding:25px 32px;margin-top:15px}
.small{color:#61738e;font-weight:800;letter-spacing:2px;margin-bottom:12px}
.big{font-size:28px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.copybox{position:relative;background:#040c17;border:1px solid #112746;border-radius:27px;padding:24px 32px}
.copy{position:absolute;right:12px;top:15px;width:50px;height:50px;border:0;border-radius:18px;background:#091c38;color:#7fb8ff;font-size:23px}
.section{display:flex;align-items:center;gap:14px;color:#71829a;font-size:23px;font-weight:850;letter-spacing:1px;margin:10px 4px 25px}
.option{
  display:flex;align-items:center;justify-content:space-between;
  padding:28px 32px;border:1px solid #112746;border-radius:30px;
  background:linear-gradient(145deg,#06111f,#020914);margin:0 0 18px;
}
.option h3{margin:0 0 10px;font-size:22px}.option p{margin:0;color:#8191aa;font-size:18px}
.switch{width:52px;height:30px;border:0;border-radius:20px;background:#43536b;padding:3px;flex:none}
.switch i{display:block;width:24px;height:24px;border-radius:50%;background:#dbe8f7;transition:.2s}
.switch.on{background:#198ff0}.switch.on i{transform:translateX(22px)}
.login{
  max-width:820px;margin:80px auto 0;padding:0 14px;
}
.hero{text-align:center;margin-bottom:32px}.hero h1{font-size:42px;margin:8px 0}.hero h1 span{color:var(--cyan)}.hero p{color:#8291a8;letter-spacing:5px;font-weight:800}
.form{padding:30px;border-radius:34px;border:1px solid var(--line);background:#050e1c}
.input{width:100%;padding:19px 20px;border-radius:18px;border:1px solid #163253;background:#020914;color:white;outline:none;font-size:17px}
.input:focus{border-color:#2c8cf2;box-shadow:0 0 0 3px #2c8cf222}
.primary{width:100%;margin-top:18px;padding:19px;border:0;border-radius:18px;color:white;font-size:17px;font-weight:900;background:linear-gradient(90deg,#276fe5,#12a9c5);cursor:pointer}
.note{text-align:center;color:#667894;font-size:13px;margin-top:14px}
.cert{display:block;text-align:center;margin-top:15px;padding:16px;border:1px solid #112746;border-radius:17px;color:#c8d4e6;text-decoration:none}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#12243a;color:white;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:620px){
  main{margin-top:32px}.card{padding:25px 24px;border-radius:30px}
  .grid{gap:12px}.copybox,.ipbox{padding:22px}.big{font-size:24px}
  .option{padding:24px}.option h3{font-size:19px}
  .hero h1{font-size:34px}.lang{top:68px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const state = {
  key: localStorage.getItem("proxyKey") || "",
  active: localStorage.getItem("proxyActive") === "1",
  options: JSON.parse(localStorage.getItem("proxyOptions") || "{}")
};

const labels = {
  pt:{panel:"PAINEL", texture:"TEXTURA", license:"LICENÇA", expires:"EXPIRA EM", ip:"SEU IP ATUAL",
      registered:"IP REGISTRADO", server:"SERVIDOR", port:"PORTA", remote:"ATIVAÇÃO REMOTA",
      activate:"ACESSAR PAINEL", key:"COLE SUA CHAVE AQUI...", save:"Salvar minha chave neste dispositivo",
      certificate:"Certificado", android:"App Android", verify:"VERIFICAR"},
  en:{panel:"PANEL", texture:"TEXTURE", license:"LICENSE", expires:"EXPIRES IN", ip:"YOUR CURRENT IP",
      registered:"REGISTERED IP", server:"SERVER", port:"PORT", remote:"REMOTE ACTIVATION",
      activate:"ACCESS PANEL", key:"ENTER YOUR KEY...", save:"Save my key on this device",
      certificate:"Certificate", android:"Android App", verify:"VERIFY"},
  es:{panel:"PANEL", texture:"TEXTURA", license:"LICENCIA", expires:"EXPIRA EN", ip:"SU IP ACTUAL",
      registered:"IP REGISTRADA", server:"SERVIDOR", port:"PUERTO", remote:"ACTIVACIÓN REMOTA",
      activate:"ACCEDER AL PANEL", key:"PEGUE SU CLAVE AQUÍ...", save:"Guardar mi clave en este dispositivo",
      certificate:"Certificado", android:"App Android", verify:"VERIFICAR"}
};
let lang="pt";

function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);
}
function save(){
  localStorage.setItem("proxyKey",state.key);
  localStorage.setItem("proxyActive",state.active?"1":"0");
  localStorage.setItem("proxyOptions",JSON.stringify(state.options));
}
function copyText(v){navigator.clipboard?.writeText(v);toast("Copiado!")}
function toggle(name){
  state.options[name]=!state.options[name];save();render();
}
function activate(){
  const input=document.querySelector("#key");
  state.key=input.value.trim();
  if(!state.key){toast("Digite uma chave primeiro");return}
  state.active=true;save();render();
}
function logout(){state.active=false;save();render()}
function render(){
  const L=labels[lang];
  if(!state.active){
    document.getElementById("app").innerHTML=`
    <div class="login">
      <div class="hero">
        <div style="font-size:54px">◈</div>
        <h1>PROXY <span>SYSTEM</span></h1>
        <p>PAINEL DE ATIVAÇÃO</p>
      </div>
      <div class="form">
        <input id="key" class="input" placeholder="${L.key}" value="${state.key}">
        <button class="primary" onclick="activate()">${L.activate}</button>
        <div class="note">Demonstração local — a validação real da chave precisa de um servidor.</div>
        <a class="cert" href="#" onclick="event.preventDefault();toast('Certificado de demonstração')">⇩ &nbsp; ${L.certificate}</a>
      </div>
    </div>`;
    return;
  }
  const opts=[
    ["holo2","HOLOGRAMA armas 2","HOLOGRAMA"],
    ["holo","HOLOGRAM ARMAS","HOLOGRAMA"],
    ["neck","HS ALTO+PESCOCO","CACHE"],
    ["chest","HS PEITO CACHE 100%","CACHE"],
    ["head","HS CABEÇA CACHE","CACHE"],
    ["body","HS CORPO","CACHE"]
  ];
  document.getElementById("app").innerHTML=`
  <header class="top">
    <div class="tabs"><button class="tab active">⌁ ${L.panel}</button><button class="tab">◉ ${L.texture}</button></div>
    <div class="lang">
      <button class="${lang==='pt'?'active':''}" onclick="lang='pt';render()">PT</button>
      <button class="${lang==='en'?'active':''}" onclick="lang='en';render()">EN</button>
      <button class="${lang==='es'?'active':''}" onclick="lang='es';render()">ES</button>
    </div>
  </header>
  <main>
    <section class="card">
      <div class="title">♢ &nbsp; ${L.license}</div>
      <div class="license">${escapeHtml(state.key)}</div>
      <div class="row"><span class="label">${L.expires}</span><span class="time">◷ &nbsp; 13h 4m</span></div>
    </section>

    <section class="card">
      <div class="title" style="color:#83b8ff">${L.ip}</div>
      <div class="ipbox"><div class="small">${L.registered}</div><div class="big">45.164.165.9</div></div>
      <div class="grid">
        <div class="copybox"><div class="small">${L.server}</div><div class="big">169.58.158.100</div><button class="copy" onclick="copyText('169.58.158.100')">▣</button></div>
        <div class="copybox"><div class="small">${L.port}</div><div class="big">8881</div><button class="copy" onclick="copyText('8881')">▣</button></div>
      </div>
    </section>

    <div class="section">☷ &nbsp; ${L.remote}</div>
    ${opts.map(o=>`
      <div class="option">
        <div><h3>${o[1]}</h3><p>${o[2]}</p></div>
        <button class="switch ${state.options[o[0]]?'on':''}" onclick="toggle('${o[0]}')"><i></i></button>
      </div>`).join("")}
    <button class="primary" style="margin-bottom:20px" onclick="logout()">Trocar chave</button>
  </main>`;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
render();
</script>
</body>
</html>
